name: Publish NuGet

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish NuGet package
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore GameInputSharp.Core.sln

      - name: Build
        run: dotnet build GameInputSharp.Core.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/GameInputSharp.Tests/GameInputSharp.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=CI"

      - name: Build offline docs
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
          python -m mkdocs build

      - name: Pack
        run: dotnet pack src/GameInputSharp.Core/GameInputSharp.Core.csproj --configuration Release --no-build --output artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: artifacts/packages/*
          if-no-files-found: error

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Fenris159

      - name: Publish package to NuGet.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "artifacts/packages" -Filter "*.nupkg" -File
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in artifacts/packages."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --source "https://api.nuget.org/v3/index.json" `
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --symbol-api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --skip-duplicate
          }

      - name: Publish package to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $packages = Get-ChildItem -Path "artifacts/packages" -Filter "*.nupkg" -File
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in artifacts/packages."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --source "https://nuget.pkg.github.com/Fenris159/index.json" `
              --api-key "$env:GITHUB_TOKEN" `
              --skip-duplicate
          }
