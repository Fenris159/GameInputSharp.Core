name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore GameInputSharp.Core.sln

      - name: Build
        run: dotnet build GameInputSharp.Core.sln --configuration Release --no-restore

      - name: GameInput diagnostics
        shell: pwsh
        run: |
          $system32 = [Environment]::SystemDirectory
          $paths = @(
            Join-Path $system32 'GameInput.dll'
            Join-Path $system32 'GameInputRedist.dll'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              $item = Get-Item $path
              Write-Host "$path exists, version $($item.VersionInfo.FileVersion)"
            } else {
              Write-Host "$path not found"
            }
          }

      - name: Test
        run: dotnet test tests/GameInputSharp.Tests/GameInputSharp.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=CI" --logger "trx;LogFileName=ci-test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: ignore

      - name: Pack
        run: dotnet pack src/GameInputSharp.Core/GameInputSharp.Core.csproj --configuration Release --no-build --output artifacts/packages
