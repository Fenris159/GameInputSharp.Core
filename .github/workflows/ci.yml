name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore GameInputSharp.Core.sln

      - name: Build
        run: dotnet build GameInputSharp.Core.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/GameInputSharp.Tests/GameInputSharp.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/GameInputSharp.Core/GameInputSharp.Core.csproj --configuration Release --no-build --output artifacts/packages
